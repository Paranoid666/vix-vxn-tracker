<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta name="description" content="VIX 与 VXN 波动率指数实时追踪、图表与信号" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="波动率" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>VIX · VXN 波动率追踪</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="install-banner" class="install-banner hidden">
      <span>安装到主屏幕, 获得每日推送</span>
      <button id="install-btn">安装</button>
    </div>

    <div class="wrap">
      <header class="top">
        <div>
          <div class="tag">VIX · VXN 波动率终端</div>
          <div class="title">波动率信号</div>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="icon-btn" title="刷新" aria-label="刷新">⟳</button>
          <button id="push-btn" class="icon-btn" title="开启推送" aria-label="开启推送">🔔</button>
        </div>
      </header>

      <div id="status-bar" class="status-bar">
        <span class="dot"></span>
        <span id="status-text">加载中…</span>
      </div>

      <div class="gauge-card">
        <div class="gauge-head">
          <div>
            <div class="lbl">综合信号</div>
            <div class="gauge-score"><span id="overall-score">--</span><small id="overall-label">/100 · 待定</small></div>
          </div>
          <div class="conf"><span id="overall-conf">置信度 --</span></div>
        </div>
        <svg class="gauge" viewBox="0 0 200 120">
          <!-- 刻度基线(中性=满弧淡色底) -->
          <path d="M20 110 A80 80 0 1 1 180 110" fill="none" stroke="#26324d" stroke-width="14" stroke-linecap="round"/>
          <!-- 信号填充弧(实色, 由 JS 着色) -->
          <path id="gauge-arc" fill="none" stroke="#2ee6a0" stroke-width="14" stroke-linecap="round"/>
          <!-- 指针(加粗 + 描边, 醒目) -->
          <g id="gauge-needle">
            <line x1="100" y1="110" x2="100" y2="30" stroke="#0b1220" stroke-width="6" stroke-linecap="round"/>
            <line x1="100" y1="110" x2="100" y2="30" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
            <circle cx="100" cy="110" r="6" fill="#0b1220" stroke="#fff" stroke-width="2"/>
          </g>
        </svg>
        <div class="gauge-foot"><span>看空 ←</span><span>中性</span><span>→ 看多</span></div>
      </div>

      <section class="cards">
        <article class="card" id="card-vix">
          <div class="card-top">
            <div><div class="idx">VIX</div><div class="idx-sub">标普500 波动率</div></div>
            <span class="sig-badge" id="vix-badge">—</span>
          </div>
          <div class="price">
            <span id="vix-price" class="value">--</span>
            <span id="vix-change" class="change">--</span>
          </div>
          <div class="ohl"><span id="vix-range">--</span></div>
          <div id="vix-chart" class="spark"><canvas></canvas></div>
          <div class="bar"><div class="bar-track"><div id="vix-pos" class="bar-pos"></div></div><div class="bar-lbl"><span>看空</span><span>中性</span><span>看多</span></div></div>
          <div id="vix-conf" class="conf-inline"></div>
        </article>

        <article class="card" id="card-vxn">
          <div class="card-top">
            <div><div class="idx">VXN</div><div class="idx-sub">纳指100 波动率</div></div>
            <span class="sig-badge" id="vxn-badge">—</span>
          </div>
          <div class="price">
            <span id="vxn-price" class="value">--</span>
            <span id="vxn-change" class="change">--</span>
          </div>
          <div class="ohl"><span id="vxn-range">--</span></div>
          <div id="vxn-chart" class="spark"><canvas></canvas></div>
          <div class="bar"><div class="bar-track"><div id="vxn-pos" class="bar-pos"></div></div><div class="bar-lbl"><span>看空</span><span>中性</span><span>看多</span></div></div>
          <div id="vxn-conf" class="conf-inline"></div>
        </article>
      </section>

      <div class="spread" id="spread-card">
        <div class="spread-h"><span>VXN / VIX 溢价</span><span id="spread-rank">—</span></div>
        <div class="spread-val" id="spread-note">--</div>
        <p id="spread-desc"></p>
      </div>

      <section class="panel">
        <h3>信号说明</h3>
        <ul id="rules" class="rules"></ul>
        <p id="disclaimer" class="disclaimer"></p>
      </section>

      <div class="app-footer">
        <span id="update-time">--</span>
      </div>
    </div>

    <div class="push-fab"><button id="push-toggle">开启每日推送</button></div>

    <script src="/vendor/chart.umd.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
