<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="VIX 与 VXN 波动率指数实时追踪、图表与信号" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="波动率" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>VIX · VXN 波动率追踪</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="install-banner" class="install-banner hidden">
      <span>安装到主屏幕, 获得每日推送</span>
      <button id="install-btn">安装</button>
    </div>

    <header class="app-header">
      <div class="brand">
        <span class="logo-dot"></span>
        <div>
          <h1>波动率追踪</h1>
          <p class="sub">VIX · VXN</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="icon-btn" title="刷新">⟳</button>
        <button id="push-btn" class="icon-btn" title="开启推送">🔔</button>
      </div>
    </header>

    <main class="content">
      <div id="status-bar" class="status-bar">
        <span id="status-text">加载中…</span>
      </div>

      <section class="cards">
        <article class="card" id="card-vix">
          <div class="card-top">
            <div>
              <h2>VIX</h2>
              <p>标普500 波动率</p>
            </div>
            <span id="vix-badge" class="badge">—</span>
          </div>
          <div class="price">
            <span id="vix-price" class="value">--</span>
            <span id="vix-change" class="change">--</span>
          </div>
          <div class="range"><span id="vix-range">--</span></div>
          <div id="vix-chart" class="chart"><canvas></canvas></div>
          <div id="vix-conf" class="conf"></div>
        </article>

        <article class="card" id="card-vxn">
          <div class="card-top">
            <div>
              <h2>VXN</h2>
              <p>纳指100 波动率</p>
            </div>
            <span id="vxn-badge" class="badge">—</span>
          </div>
          <div class="price">
            <span id="vxn-price" class="value">--</span>
            <span id="vxn-change" class="change">--</span>
          </div>
          <div class="range"><span id="vxn-range">--</span></div>
          <div id="vxn-chart" class="chart"><canvas></canvas></div>
          <div id="vxn-conf" class="conf"></div>
        </article>
      </section>

      <section class="panel summary">
        <h3>综合信号</h3>
        <div class="summary-row">
          <div id="overall-badge" class="overall-badge">—</div>
          <div class="overall-meta">
            <div id="overall-score" class="score-num">0</div>
            <p id="overall-conf" class="muted">置信度 --</p>
          </div>
        </div>
        <div class="meter">
          <div id="overall-meter" class="meter-fill"></div>
          <div class="meter-labels"><span>看空</span><span>中性</span><span>看多</span></div>
        </div>
        <div id="spread-note" class="spread-note"></div>
      </section>

      <section class="panel">
        <h3>信号说明</h3>
        <ul id="rules" class="rules"></ul>
        <p id="disclaimer" class="disclaimer"></p>
      </section>
    </main>

    <footer class="app-footer">
      <span id="update-time">--</span>
      <button id="push-toggle" class="btn-secondary">开启每日推送</button>
    </footer>

    <script src="/vendor/chart.umd.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
